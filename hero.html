<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bluprint Models — Hero</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="stylesheet" href="/hero.css" />
<style>
  html, body {
    margin: 0;
    background: #000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    /* Explicitly keep native single-finger vertical panning (page scroll) —
       everything else (pinch-zoom, horizontal pan) is left unlisted, which
       disables the browser's own handling of it, freeing a second
       simultaneous finger for main.js's own two-finger drag-to-tilt gesture
       instead of fighting native pinch-zoom over it. */
    touch-action: pan-y;
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hero-overlay">
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="hero-text">
        <div class="hero-eyebrow">
          <img class="hero-eyebrow-dot" src="/hero/eyebrow-dot.svg" alt="" />
          <p class="hero-eyebrow-label">Next generation energy</p>
        </div>
        <div class="hero-title">
          <p>Smarter energy.</p>
          <p>From home to the grid.</p>
        </div>
      </div>
      <div class="hero-cards-viewport">
        <div class="hero-cards">
          <button type="button" class="hero-card" data-target-index="0">
            <span class="hero-card-progress"></span>
            <span class="hero-card-icon"></span>
            <span class="hero-card-text">
              <span class="hero-card-number">01</span>
              <span class="hero-card-label">For home</span>
            </span>
          </button>
          <button type="button" class="hero-card" data-target-index="1">
            <span class="hero-card-progress"></span>
            <span class="hero-card-icon"></span>
            <span class="hero-card-text">
              <span class="hero-card-number">02</span>
              <span class="hero-card-label">For Business</span>
            </span>
          </button>
          <button type="button" class="hero-card" data-target-index="2">
            <span class="hero-card-progress"></span>
            <span class="hero-card-icon"></span>
            <span class="hero-card-text">
              <span class="hero-card-number">03</span>
              <span class="hero-card-label">For Investors</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
  <script type="module" src="/hero-cards.js"></script>
</body>
</html>
