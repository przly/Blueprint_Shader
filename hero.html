<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bluprint Models — Hero</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="stylesheet" href="/hero.css" />
<style>
  html, body {
    margin: 0;
    background: #000;
    /* Belt-and-suspenders: with the vw-sized canvas below, a vertical
       scrollbar (e.g. from the placeholder section) would otherwise widen
       the horizontal scroll range by the scrollbar's own width. */
    overflow-x: hidden;
  }
  canvas {
    display: block;
    /* 100% (of body), not 100vw — vw is measured against the initial
       containing block and ignores the vertical scrollbar's width, so once
       the page is tall enough to scroll, 100vw overshoots the visible
       width and the canvas (and page) gain horizontal scroll too. */
    width: 100%;
    height: 100vh;
    /* Explicitly keep native single-finger vertical panning (page scroll) —
       everything else (pinch-zoom, horizontal pan) is left unlisted, which
       disables the browser's own handling of it, freeing a second
       simultaneous finger for main.js's own two-finger drag-to-tilt gesture
       instead of fighting native pinch-zoom over it. */
    touch-action: pan-y;
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hero-overlay">
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="hero-text">
        <div class="hero-eyebrow">
          <img class="hero-eyebrow-dot" src="/hero/eyebrow-dot.svg" alt="" />
          <p class="hero-eyebrow-label">Next generation energy</p>
        </div>
        <div class="hero-title">
          <p>Smarter energy.</p>
          <p>From home to the grid.</p>
        </div>
      </div>
      <div class="hero-cards-viewport">
        <div class="hero-cards">
          <button type="button" class="hero-card" data-target-index="0">
            <span class="hero-card-progress"></span>
            <span class="hero-card-icon"></span>
            <span class="hero-card-text">
              <span class="hero-card-number">01</span>
              <span class="hero-card-label">For home</span>
            </span>
          </button>
          <button type="button" class="hero-card" data-target-index="1">
            <span class="hero-card-progress"></span>
            <span class="hero-card-icon"></span>
            <span class="hero-card-text">
              <span class="hero-card-number">02</span>
              <span class="hero-card-label">For Business</span>
            </span>
          </button>
          <button type="button" class="hero-card" data-target-index="2">
            <span class="hero-card-progress"></span>
            <span class="hero-card-icon"></span>
            <span class="hero-card-text">
              <span class="hero-card-number">03</span>
              <span class="hero-card-label">For Investors</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- Temporary scroll-test placeholder — .hero-overlay is `position: fixed`
       so it stays pinned on top of this as you scroll past it; that's
       expected for now and not something this placeholder tries to fix.
       Delete this section once real content replaces it. -->
  <section style="min-height: 100vh; background: #041c2c; color: #fff; display: flex; align-items: center; justify-content: center; font-family: sans-serif; font-size: 24px;">
    Scroll-test placeholder — delete once real content exists
  </section>
  <script type="module" src="/main.js"></script>
  <script type="module" src="/hero-cards.js"></script>
</body>
</html>
